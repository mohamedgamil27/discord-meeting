name: Daily EGX30 Pipeline

on:
  schedule:
    - cron: "30 13 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-egx30-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  collect-egx30:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run collector
        run: python src/collect_egx30.py --output-root data --diagnostics-dir diagnostics --retries 3 --retry-delay 20

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: egx30-diagnostics-${{ github.run_id }}
          path: diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit and push data changes
        if: success()
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: add automated EGX30 data pipeline"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
