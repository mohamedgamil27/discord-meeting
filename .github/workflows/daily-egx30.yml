name: Daily EGX30 collection

on:
  schedule:
    - cron: '0 15 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-egx30-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run collector
        run: python src/collect_egx30.py

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: egx30-debug-${{ github.run_id }}
          path: debug/egx30/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit generated data
        if: success()
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          SESSION_DATE=$(python - <<'PY'
from pathlib import Path
import json

files = sorted(Path("data").glob("**/egx30_daily_*.json"), key=lambda p: p.stat().st_mtime, reverse=True)
if not files:
    raise SystemExit("No daily JSON files found")
payload = json.loads(files[0].read_text(encoding="utf-8"))
print(payload.get("Date", "unknown-date"))
PY
)

          git commit -m "data: add EGX30 session ${SESSION_DATE}"
          git pull --rebase origin "${BRANCH_NAME}"
          git push origin "HEAD:${BRANCH_NAME}"
